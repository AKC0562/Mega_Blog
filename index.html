<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect x='4' y='4' width='56' height='56' rx='14' fill='%23E4572E'/%3E%3Crect x='4' y='4' width='56' height='56' rx='14' fill='none' stroke='%2317130C' stroke-width='3'/%3E%3Ctext x='32' y='43' text-anchor='middle' font-family='Georgia,serif' font-weight='900' font-size='32' fill='%23FAF6EF'%3EM%3C/text%3E%3Ccircle cx='47' cy='18' r='7' fill='%23FFC53D' stroke='%2317130C' stroke-width='2.5'/%3E%3C/svg%3E" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Mega Blog — fresh stories, honest notes and field guides from people who love to write." />
    <meta name="theme-color" content="#FAF6EF" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#14120E" media="(prefers-color-scheme: dark)" />
    <title>Mega Blog — fresh stories, honestly told</title>
    <script>
      // Set theme before paint to avoid flash. Stored choice wins, else OS preference.
      try {
        var stored = localStorage.getItem('mega-blog-theme');
        var theme = stored || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
        if (theme === 'dark') document.documentElement.classList.add('dark');
        else document.documentElement.classList.remove('dark');
      } catch (e) {}
    </script>
  </head>
  <body class="w-full">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
